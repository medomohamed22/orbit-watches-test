<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Watches | ساعات العصر الجديد الفاخرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        tajawal: ['Tajawal', 'sans-serif'],
                    },
                    colors: {
                        orbit: {
                            dark: '#020617',
                            card: '#090D16',
                            cardHover: '#0F172A',
                            blue: '#2563EB',
                            blueLight: '#3B82F6',
                            accent: '#60A5FA'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-orbit-dark text-white font-tajawal antialiased selection:bg-orbit-blueLight selection:text-white w-full overflow-x-hidden">

    <!-- Header / Navbar -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-orbit-dark/95 backdrop-blur-xl border-b border-white/10 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-orbit-blue to-orbit-blueLight flex items-center justify-center text-white font-black text-xl shadow-lg shadow-orbit-blue/30 ring-2 ring-orbit-blueLight/30 shrink-0">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </div>
                <div>
                    <span class="text-lg sm:text-2xl font-black tracking-wider bg-gradient-to-r from-white via-blue-200 to-orbit-accent bg-clip-text text-transparent">Orbit Watches</span>
                    <span class="block text-[10px] text-orbit-accent font-bold tracking-widest uppercase">Luxury Timepieces</span>
                </div>
            </div>
            
            <nav class="hidden md:flex items-center gap-8 text-sm font-semibold text-gray-300">
                <a href="#hero" class="hover:text-orbit-accent transition">الرئيسية</a>
                <a href="#features" class="hover:text-orbit-accent transition">المميزات</a>
                <a href="#viewer-3d" class="hover:text-orbit-accent transition">عرض 3D التفاعلي</a>
                <a href="#products" class="hover:text-orbit-accent transition">التشكيلة</a>
            </nav>

            <div class="flex items-center gap-3">
                <button onclick="toggleAIModal()" class="bg-orbit-card border border-orbit-accent/30 hover:border-orbit-accent px-4 py-2.5 rounded-2xl text-white flex items-center gap-2.5 transition-all shadow-md group min-h-[44px]">
                    <i class="fa-solid fa-robot text-orbit-accent"></i>
                    <span class="text-xs sm:text-sm font-bold">ابحث بالذكاء الاصطناعي</span>
                </button>
                <button onclick="toggleCart()" aria-label="فتح سلة الشراء" class="relative bg-orbit-card border border-white/15 hover:border-orbit-blueLight px-4 py-2.5 rounded-2xl text-white flex items-center gap-2.5 transition-all shadow-md group min-h-[44px] min-w-[44px]">
                    <i class="fa-solid fa-cart-shopping text-orbit-accent text-base group-hover:scale-110 transition"></i>
                    <span id="cartCount" class="absolute -top-1.5 -right-1.5 bg-orbit-blueLight text-white text-[11px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow-md ring-2 ring-orbit-dark">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- AI Search Modal -->
    <div id="aiModal" class="fixed inset-0 z-[60] bg-black/85 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-orbit-card border border-orbit-accent/30 rounded-3xl max-w-lg w-full p-6 sm:p-8 relative shadow-2xl">
            <button onclick="toggleAIModal()" class="absolute top-5 left-5 text-gray-400 hover:text-white text-xl p-2 rounded-xl hover:bg-white/10 transition"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-xl font-black mb-4 text-orbit-accent"><i class="fa-solid fa-robot ml-2"></i> ابحث بالذكاء الاصطناعي</h3>
            <form onsubmit="handleAISearch(event)" class="space-y-4">
                <textarea id="aiQuery" required placeholder="صف الساعة التي تبحث عنها (مثال: ساعة رسمية بجلد بني وهيكل ذهبي)..." class="w-full bg-orbit-dark border border-white/15 rounded-2xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-orbit-accent shadow-inner min-h-[120px]"></textarea>
                <button type="submit" id="aiBtn" class="w-full bg-orbit-accent text-orbit-dark font-black py-4 rounded-2xl shadow-lg hover:opacity-90 transition">ابحث الآن</button>
            </form>
            <div id="aiResults" class="mt-6 space-y-3"></div>
        </div>
    </div>

    <!-- Hero Section -->
    <section id="hero" class="relative min-h-[92vh] flex items-center justify-center pt-28 pb-16 px-4">
        <div class="max-w-7xl mx-auto text-center space-y-8">
            <h1 class="text-4xl sm:text-6xl font-black tracking-tight">ارتقِ بمظهرك مع <br/><span class="bg-gradient-to-r from-white via-blue-100 to-orbit-accent bg-clip-text text-transparent">ساعات Orbit الفاخرة</span></h1>
            <p class="text-gray-300 text-lg max-w-2xl mx-auto">تصاميم استثنائية مصممة خصيصاً للرجل العصري.</p>
            <a href="#products" class="inline-block bg-gradient-to-r from-orbit-blue to-orbit-blueLight text-white font-extrabold px-8 py-4 rounded-2xl shadow-xl shadow-orbit-blue/30 hover:shadow-orbit-blue/50 transition-all">تصفح التشكيلة</a>
        </div>
    </section>

    <!-- Scripts -->
    <script>
        function toggleAIModal() {
            const modal = document.getElementById('aiModal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        async function handleAISearch(e) {
            e.preventDefault();
            const query = document.getElementById('aiQuery').value;
            const btn = document.getElementById('aiBtn');
            const results = document.getElementById('aiResults');
            
            btn.innerText = 'جاري البحث...';
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const data = await response.json();
                results.innerHTML = `<p class="text-sm text-gray-300">${data.message || 'تم العثور على نتائج مشابهة!'}</p>`;
            } catch (err) {
                results.innerHTML = `<p class="text-sm text-red-400">حدث خطأ أثناء البحث، يرجى المحاولة لاحقاً.</p>`;
            } finally {
                btn.innerText = 'ابحث الآن';
                btn.disabled = false;
            }
        }
        
        // [Cart logic remains same as before]
        let cart = [];
        function toggleCart() { /* ... */ }
    </script>
</body>
</html>
